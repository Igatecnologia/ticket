# ============================================
# Chatwoot - Iga Tecnologia
# Nginx reverse proxy (porta 3000 do container)
# ============================================
# Instalar em: /etc/nginx/sites-available/chatwoot
# Ativar com:  ln -s /etc/nginx/sites-available/chatwoot /etc/nginx/sites-enabled/
# Testar:      nginx -t && systemctl reload nginx
# SSL:         certbot --nginx -d suporte.igatech.com.br
# ============================================

upstream chatwoot {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name suporte.igatech.com.br;

    # Upload de arquivos (anexos em conversas)
    client_max_body_size 100m;

    # Logs
    access_log /var/log/nginx/chatwoot_access.log;
    error_log  /var/log/nginx/chatwoot_error.log;

    # ActionCable (websocket) - mesmo location, mas o proxy_set_header
    # Upgrade/Connection abaixo ja cobre /cable
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl   on;

        proxy_pass http://chatwoot;

        # Timeouts altos para long-polling e uploads grandes
        proxy_read_timeout    900;
        proxy_send_timeout    900;
        proxy_connect_timeout 60;

        proxy_redirect off;
        proxy_buffering off;
    }
}

# Apos rodar `certbot --nginx -d suporte.igatech.com.br` o proprio
# Certbot adiciona o bloco server (listen 443 ssl) e redireciona 80 -> 443.
